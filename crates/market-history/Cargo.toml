[package]
name = "market-history"
version = "0.1.0"
edition = "2021"
description = "Shared Binance aggTrade aggregation and history types for et-rs and et-data-service"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
rust_decimal = { version = "1", features = ["serde-str"] }

[dev-dependencies]
serde_json = "1"

