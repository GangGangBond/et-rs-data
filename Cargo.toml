[workspace]
members = ["crates/market-history", "crates/market-depth"]
resolver = "2"

[package]
name = "et-data-service"
version = "0.1.0"
edition = "2021"
description = "PostgreSQL-backed Binance Spot USDT footprint history service"
license = "MIT"
readme = "README.md"

[features]
default = []
# Keep collection opt-in until a stable data source and storage budget are ready.
hyperliquid = []

[dependencies]
market-depth = { path = "crates/market-depth" }
market-history = { path = "crates/market-history" }
anyhow = "1"
axum = "0.8"
clap = { version = "4", features = ["derive", "env"] }
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "postgres", "json", "migrate", "macros"] }
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = "thin"
strip = true

